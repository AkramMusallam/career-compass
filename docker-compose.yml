services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev_root_pass}
      MYSQL_DATABASE: career_compass
      MYSQL_USER: ${MYSQL_USER:-career_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev_career_pass}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u \"$$MYSQL_USER\""]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Broker/Backend for Celery (scheduled weekly progress emails & async tasks)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ENV: development
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-local-jwt-secret-not-for-prod}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-career_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev_career_pass}
      MYSQL_DB: career_compass
      USE_SQLITE_FALLBACK: "0"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: career_compass
      USE_MONGOMOCK: "0"
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000"
      REDIS_URL: redis://redis:6379/0
      FRONTEND_BASE_URL: "http://localhost:3000"
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      EMAIL_NOTIFICATIONS_ENABLED: "0"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_USE_TLS: "1"
      SMTP_FROM_EMAIL: "no-reply@career-compass.app"
      SMTP_FROM_NAME: "Career Compass"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_uploads:/app/uploads

  celery-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ENV: development
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-local-jwt-secret-not-for-prod}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-career_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev_career_pass}
      MYSQL_DB: career_compass
      USE_SQLITE_FALLBACK: "0"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: career_compass
      USE_MONGOMOCK: "0"
      REDIS_URL: redis://redis:6379/0
      FRONTEND_BASE_URL: "http://localhost:3000"
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      EMAIL_NOTIFICATIONS_ENABLED: "0"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_USE_TLS: "1"
      SMTP_FROM_EMAIL: "no-reply@career-compass.app"
      SMTP_FROM_NAME: "Career Compass"
    volumes:
      - backend_uploads:/app/uploads

  celery-beat:
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A app.worker.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
    environment:
      ENV: development
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-local-jwt-secret-not-for-prod}
      REDIS_URL: redis://redis:6379/0
      WEEKLY_EMAIL_DAY_OF_WEEK: monday
      WEEKLY_EMAIL_HOUR: "8"
      WEEKLY_EMAIL_MINUTE: "0"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  backend_uploads:
