name: Career Compass CI

on:
  push:
    branches: [ "master", "main", "develop" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx mongomock ruff
        
    - name: Ruff
      working-directory: ./backend
      run: |
        ruff check . --output-format github --exit-zero
        ruff check . --select E9,F63,F7,F82

    - name: Run Backend Tests
      working-directory: ./backend
      env:
        USE_SQLITE_FALLBACK: "1"
        USE_MONGOMOCK: "1"
        EMAIL_NOTIFICATIONS_ENABLED: "0"
        JWT_SECRET_KEY: "test-secret-key-for-github-actions-only"
        ENV: "testing"
      run: |
        pytest tests/ -v

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Install and Build
      working-directory: ./frontend
      run: |
        npm ci
        npm run lint
        npm run build
    - name: Browser E2E
      working-directory: ./frontend
      env:
        CHROME_PATH: /usr/bin/google-chrome
      run: npm run test:browser

  build-mobile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: './mobile/package-lock.json'
    - name: Install and check mobile app
      working-directory: ./mobile
      env:
        EXPO_PUBLIC_API_BASE_URL: https://example.com/api
      run: |
        npm ci
        node --test tests/*.test.cjs
        npx expo export --platform all --output-dir dist

  lint-extension:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Check Chrome Extension Syntax & Manifest
      working-directory: ./chrome-extension
      run: |
        node --check background.js
        node --check content.js
        node --check popup.js
        node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.json','utf8')); if(m.manifest_version!==3) throw new Error('Expected MV3');"
