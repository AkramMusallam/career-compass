server {
    listen 80;
    server_name _;
    charset utf-8;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # ترويسات الأمان القياسية (OWASP Secure Headers)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' http: https:; media-src 'self' blob:;" always;

    client_max_body_size 10M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    # يدعم React Router (SPA) — أي مسار غير موجود كملف يُعاد توجيهه إلى index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # توجيه طلبات الـ API إلى الباك إند داخل شبكة docker-compose
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
