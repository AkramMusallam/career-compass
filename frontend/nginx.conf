map $request_uri $redacted_request_uri {
    default $request_uri;
    "~^(/api)?(/reset-password|/company-invitation|/verify-email|/shared)/[^?]+" "$1$2/[REDACTED]";
    "~^(/api)?(/reset-password|/company-invitation|/verify-email|/shared)\?" "$1$2?[REDACTED]";
}

log_format redacted_main '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $redacted_request_uri $server_protocol" '
                         '$status $body_bytes_sent "-" "$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;
    charset utf-8;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log redacted_main;

    # ترويسات الأمان القياسية (OWASP Secure Headers)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

    client_max_body_size 10M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    location ~ ^/(reset-password|company-invitation|verify-email|shared)(/|$) {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # يدعم React Router (SPA) — أي مسار غير موجود كملف يُعاد توجيهه إلى index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # توجيه طلبات الـ API إلى الباك إند داخل شبكة docker-compose
    location /api/ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
