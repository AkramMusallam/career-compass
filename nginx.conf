limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;

map $request_uri $redacted_request_uri {
    default $request_uri;
    "~^(/api)?(/reset-password|/company-invitation|/verify-email|/shared)/[^?]+" "$1$2/[REDACTED]";
    "~^(/api)?(/reset-password|/company-invitation|/verify-email|/shared)\?" "$1$2?[REDACTED]";
}

log_format redacted_main '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $redacted_request_uri $server_protocol" '
                         '$status $body_bytes_sent "-" "$http_user_agent" "$http_x_forwarded_for"';

# HTTP entrypoint: serve ACME challenges only and redirect all other traffic to HTTPS.
server {
    listen 80;
    server_name _;
    charset utf-8;
    server_tokens off;
    access_log /var/log/nginx/access.log redacted_main;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    add_header Pragma "no-cache" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
