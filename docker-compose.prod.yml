services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: career_compass
      MYSQL_USER: ${MYSQL_USER:-career_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-career_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # حاوية الذكاء الاصطناعي التي ستعمل داخل السيرفر
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  backend:
    image: career-compass-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      ENV: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-long-random-secret-in-production}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-career_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-career_pass}
      MYSQL_DB: career_compass
      USE_SQLITE_FALLBACK: "0"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: career_compass
      USE_MONGOMOCK: "0"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://129.159.143.77,http://localhost:5173,http://localhost:3000,http://localhost}
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "0"
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://129.159.143.77}
      # ربط الباك إند بحاوية ollama
      OLLAMA_HOST: "http://ollama:11434"
    volumes:
      - backend_uploads:/app/uploads

  celery-worker:
    image: career-compass-backend:latest
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      ENV: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-long-random-secret-in-production}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-career_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-career_pass}
      MYSQL_DB: career_compass
      USE_SQLITE_FALLBACK: "0"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: career_compass
      USE_MONGOMOCK: "0"
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "0"
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://129.159.143.77}
      OLLAMA_HOST: "http://ollama:11434"
    volumes:
      - backend_uploads:/app/uploads

  celery-beat:
    image: career-compass-backend:latest
    restart: unless-stopped
    command: celery -A app.worker.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      ENV: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-long-random-secret-in-production}
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "0"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  # Nginx يعمل كبوابة يستقبل الزيارات من بورت 80 ويوجهها للـ Frontend أو Backend
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  ollama_data:
  backend_uploads:
